name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node_version:
          - ''
          - '26'
          - '24'
          - '22'
    name: Node.js ${{ matrix.node_version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: NPM Rebuild
        run: yarn

      - name: Run tests
        run: yarn test-coverage

      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          disable_search: true
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: NPM Rebuild
        run: yarn

      - name: Run Linting
        run: yarn lint
