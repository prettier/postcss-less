name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node_version:
          - ''
          - '12'
    name: Node.js ${{ matrix.node_version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: NPM Rebuild
        run: yarn

      - name: Run unit tests
        run: yarn ci:coverage

      - name: Submit coverage data to codecov.
        run: bash <(curl -s https://codecov.io/bash)

  lint:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: NPM Rebuild
        run: yarn

      - name: Run Linting
        run: yarn lint
